<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RockPaperScissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissors Game</h1>
    <div class="choices">
        <div id="rock" class="choice">
            <img src="images/rock.jpg" alt="">
        </div>
        <div id="paper" class="choice">
            <img src="images/paper.jpg" alt="">
        </div>
        <div id="scissor" class="choice">
            <img src="images/scissor.jpg" alt="">
        </div>
    </div>

    <div class="score-board">
        <div class="score" >
            <p id="user-score" >0</p>
            <p>You</p>
        </div>

        <div  class="score">
            <p id="comp-score" >0</p>
            <p>Computer</p>
        </div>
    </div>

    <div class="play-button">

        <button id="btn" >Playy!!!</button>
    
    </div>
    
    <script src="index.js"></script>
</body>
</html>
